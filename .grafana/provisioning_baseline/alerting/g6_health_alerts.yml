apiVersion: 1

groups:
  - orgId: 1
    name: G6 Health Alerts
    folder: G6 Platform
    interval: 1m
    rules:
      # Alert 1: Broker API Failure
      - uid: g6_broker_api_failure
        title: Broker API Success Rate Critical
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: '${DS_INFINITY}'
            model:
              columns: []
              datasource:
                type: yesoreyeram-infinity-datasource
                uid: '${DS_INFINITY}'
              filters: []
              format: table
              global_query_id: ''
              refId: A
              root_selector: ''
              source: url
              type: json
              url: 'http://127.0.0.1:9500/health/metrics'
              url_options:
                data: ''
                method: GET
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          description: 'Broker API success rate has dropped to {{ $values.B.broker_api_success_rate }}% (threshold: 90%). Collection cycles will fail. Check broker connectivity and API credentials.'
          summary: 'Critical: Broker API failing'
        labels:
          severity: critical
          component: broker_api
          impact: high
        isPaused: false

