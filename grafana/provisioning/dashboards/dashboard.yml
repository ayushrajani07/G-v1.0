apiVersion: 1

providers:
  - name: G6 Dashboards
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # Adjust this path if Grafana runs from a different working directory
      path: grafana/dashboards
      recursive: true
      foldersFromFilesStructure: true
