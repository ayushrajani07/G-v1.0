          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: 'Multiple collection cycles have failed ({{ $values.B.collection_cycles_failed }} failures). Data gaps may occur. Check logs for error details.'
          summary: 'Warning: Collection cycles failing'
        labels:
          severity: high
          component: collection
          impact: medium
        isPaused: false

