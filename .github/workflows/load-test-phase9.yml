name: Phase 9 Load Test

# Opt-in workflow: only runs on tag-based triggers or manual dispatch
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration in seconds'
        required: false
        default: '10'
      qps:
        description: 'Target queries per second'
        required: false
        default: '5'
  push:
    tags:
      - 'load-test-*'
      - 'v*-load-test'

jobs:
  load-test:
    name: ML Ensemble Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Start ML Ensemble API
        run: |
          # Start API in background
          python -m src.web.api.ml_ensemble --host 0.0.0.0 --port 9210 &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          
          # Wait for API to be ready
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9210/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 2
          done
          
          # Verify API is responding
          curl http://localhost:9210/health || exit 1
        timeout-minutes: 2
      
      - name: Run short load test (async version)
        run: |
          DURATION=${{ github.event.inputs.duration || '10' }}
          QPS=${{ github.event.inputs.qps || '10' }}
          
          echo "Running async load test: duration=${DURATION}s, qps=${QPS}"
          
          # Create reports directory
          mkdir -p reports
          
          # Use async version with httpx for higher concurrency
          python scripts/ml/load_test_ensemble_async.py \
            --api-host localhost \
            --api-port 9210 \
            --indices NIFTY \
            --qps ${QPS} \
            --concurrency 5 \
            --duration ${DURATION} \
            --output reports/load_test_results.json \
            --csv-out reports/load_test_latencies.csv
        continue-on-error: true
        timeout-minutes: 5
      
      - name: Validate metrics endpoint
        run: |
          python scripts/ml/validate_metrics.py \
            --host localhost \
            --port 9210 \
            --output reports/metrics_validation.json
        continue-on-error: true
      
      - name: Fetch cache metrics
        run: |
          curl -s http://localhost:9210/api/ml/ensemble/cache_metrics \
            > reports/cache_metrics.json || echo '{}' > reports/cache_metrics.json
        continue-on-error: true
      
      - name: Stop API server
        if: always()
        run: |
          if [ -n "$API_PID" ]; then
            kill $API_PID || true
            wait $API_PID || true
          fi
      
      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            reports/load_test_results.json
            reports/load_test_latencies.csv
            reports/metrics_validation.json
            reports/cache_metrics.json
          retention-days: 30
      
      - name: Check performance thresholds
        if: always()
        run: |
          echo "========================================"
          echo "Checking Performance Thresholds"
          echo "========================================"
          
          if [ ! -f reports/load_test_results.json ]; then
            echo "ERROR: Load test results not found"
            exit 1
          fi
          
          # Extract metrics using jq
          ERROR_RATE=$(jq -r '.summary.error_rate // 1' reports/load_test_results.json)
          P95_LATENCY=$(jq -r '.latency_ms.p95 // 9999' reports/load_test_results.json)
          OVERALL_PASS=$(jq -r '.targets.overall_pass // false' reports/load_test_results.json)
          
          echo "Metrics:"
          echo "  Error Rate: ${ERROR_RATE}"
          echo "  P95 Latency: ${P95_LATENCY}ms"
          echo "  Overall Pass: ${OVERALL_PASS}"
          echo ""
          
          # Check thresholds (error rate > 2%, p95 > 1000ms)
          THRESHOLD_ERROR_RATE=0.02
          THRESHOLD_P95=1000
          
          # Use awk for float comparison
          ERROR_RATE_OK=$(awk -v rate="$ERROR_RATE" -v threshold="$THRESHOLD_ERROR_RATE" 'BEGIN {print (rate <= threshold) ? "true" : "false"}')
          P95_OK=$(awk -v p95="$P95_LATENCY" -v threshold="$THRESHOLD_P95" 'BEGIN {print (p95 <= threshold) ? "true" : "false"}')
          
          echo "Threshold Checks:"
          echo "  Error Rate <= ${THRESHOLD_ERROR_RATE} (2%): ${ERROR_RATE_OK}"
          echo "  P95 <= ${THRESHOLD_P95}ms: ${P95_OK}"
          echo "========================================"
          
          # Fail if thresholds are violated
          if [ "$ERROR_RATE_OK" = "false" ]; then
            echo "ERROR: Error rate ${ERROR_RATE} exceeds threshold ${THRESHOLD_ERROR_RATE}"
            exit 1
          fi
          
          if [ "$P95_OK" = "false" ]; then
            echo "ERROR: P95 latency ${P95_LATENCY}ms exceeds threshold ${THRESHOLD_P95}ms"
            exit 1
          fi
          
          if [ "$OVERALL_PASS" = "false" ]; then
            echo "ERROR: Load test did not pass overall checks"
            exit 1
          fi
          
          echo "✓ All performance thresholds passed"
      
      - name: Display results summary
        if: always()
        run: |
          echo "========================================"
          echo "Load Test Results Summary"
          echo "========================================"
          
          if [ -f reports/load_test_results.json ]; then
            echo "Load Test Results:"
            cat reports/load_test_results.json | jq -r '
              "  Total Requests: \(.summary.total_requests)",
              "  Successful: \(.summary.successful)",
              "  Failed: \(.summary.failed)",
              "  Success Rate: \(.summary.success_rate * 100)%",
              "  Throughput: \(.summary.throughput) req/s",
              "  P50 Latency: \(.latency_ms.p50)ms",
              "  P95 Latency: \(.latency_ms.p95)ms",
              "  P99 Latency: \(.latency_ms.p99)ms",
              "  Overall Pass: \(.targets.overall_pass)"
            ' || echo "  Could not parse results"
          else
            echo "  No results file found"
          fi
          
          echo ""
          
          if [ -f reports/metrics_validation.json ]; then
            echo "Metrics Validation:"
            cat reports/metrics_validation.json | jq -r '
              "  Status: \(.status)",
              "  Message: \(.message)",
              "  Required Metrics Found: \(.required_metrics.found | length)",
              "  Required Metrics Missing: \(.required_metrics.missing | length)"
            ' || echo "  Could not parse validation"
          else
            echo "  No validation file found"
          fi
          
          echo "========================================"
