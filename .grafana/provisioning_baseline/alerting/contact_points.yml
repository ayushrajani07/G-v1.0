apiVersion: 1

contactPoints:
  # Console notification (always enabled, logs to stdout)
  - orgId: 1
    name: Console Notifications
    receivers:
      - uid: console_receiver
        type: webhook
        settings:
          url: 'http://127.0.0.1:9500/api/alerts/console'
          httpMethod: POST
        disableResolveMessage: false

  # File-based notification (writes to alerts.log)
  - orgId: 1
    name: File Logger
    receivers:
      - uid: file_logger
        type: webhook
        settings:
          url: 'http://127.0.0.1:9500/api/alerts/file'
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Console Notifications
    group_by:
      - alertname
      - severity
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts: notify immediately, repeat every hour
      - receiver: Console Notifications
        matchers:
          - severity = critical
        group_wait: 5s
        repeat_interval: 1h
        continue: true
      
      # High severity: notify after 30s, repeat every 2 hours
      - receiver: Console Notifications
        matchers:
          - severity = high
        group_wait: 30s
        repeat_interval: 2h
        continue: true
      
      # Medium severity: notify after 1m, repeat every 4 hours
      - receiver: Console Notifications
        matchers:
          - severity = medium
        group_wait: 1m
        repeat_interval: 4h
        continue: true

      # File logger for all alerts (parallel)
      - receiver: File Logger
        matchers:
          - severity =~ "critical|high|medium"
        continue: false
