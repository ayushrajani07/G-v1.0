name: Prometheus Rules Validation
on:
  pull_request:
    paths:
      - prometheus_alerts_drift.yml
      - prometheus_recording_rules_generated.yml
  push:
    branches:
      - main
    paths:
      - prometheus_alerts_drift.yml
      - prometheus_recording_rules_generated.yml
jobs:
  prom-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Generate drift rules fragment
        run: python scripts/generate_drift_rules.py
      - name: Verify drift rules integrity
        run: python scripts/verify_drift_rules_integrity.py
      - name: Install promtool
        run: |
          VERSION=2.55.0
          curl -LO https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz
          tar xzf prometheus-${VERSION}.linux-amd64.tar.gz
          sudo mv prometheus-${VERSION}.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version
      - name: Validate alert rules
        run: promtool check rules prometheus_alerts_drift.yml
      - name: Validate recording rules
        run: promtool check rules prometheus_recording_rules_generated.yml
      - name: Show rule file diff vs main (if PR)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin main
          echo 'Changed lines:'
          git diff --unified=0 origin/main -- prometheus_alerts_drift.yml prometheus_recording_rules_generated.yml || true
