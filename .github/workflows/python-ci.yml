name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      G6_DRIFT_FEATURE_MAP_JSON: configs/ml/feature_map.sample.json
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (quick)
        run: |
          pytest -q --disable-warnings --maxfail=1

      - name: Coverage (xml)
        run: |
          pytest -q --disable-warnings --cov=. --cov-report=xml

      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  promtool-rules:
    name: Prometheus rules validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download promtool
        run: |
          set -e
          VER=2.53.0
          curl -sSL -o prom.tar.gz https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz
          tar -xzf prom.tar.gz
          echo "PROMTOOL=$(pwd)/prometheus-${VER}.linux-amd64/promtool" >> $GITHUB_ENV
      - name: Validate drift alert rules
        run: |
          "$PROMTOOL" check rules prometheus_alerts_drift.yml
      - name: Validate regime alert rules
        run: |
          "$PROMTOOL" check rules prometheus_alerts_regime.yml
      - name: Validate performance alert rules
        run: |
          "$PROMTOOL" check rules prometheus_alerts_performance.yml

  promtool-generated-rules:
    name: Generated per-index rules validation
    runs-on: ubuntu-latest
    env:
      INDICES: NIFTY,BANKNIFTY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate per-index drift rules
        run: |
          python scripts/monitoring/generate_drift_alerts.py --template monitoring/templates/prometheus_alerts_drift.per_index.tmpl.yml --indices "$INDICES" --out prometheus_alerts_drift.generated.yml
      - name: Download promtool
        run: |
          set -e
          VER=2.53.0
          curl -sSL -o prom.tar.gz https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz
          tar -xzf prom.tar.gz
          echo "PROMTOOL=$(pwd)/prometheus-${VER}.linux-amd64/promtool" >> $GITHUB_ENV
      - name: Validate generated rules
        run: |
          "$PROMTOOL" check rules prometheus_alerts_drift.generated.yml

  feature-map-validate:
    name: Feature map JSON validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate sample and prod feature maps
        run: |
          python scripts/ml/validate_feature_map.py configs/ml/feature_map.sample.json configs/ml/feature_map.prod.json

  lint:
    name: Lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      G6_DRIFT_FEATURE_MAP_JSON: configs/ml/feature_map.sample.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff
        run: |
          ruff check . --format=github --exit-zero

      - name: Mypy (path_forecast only)
        run: |
          mypy src/path_forecast || true
