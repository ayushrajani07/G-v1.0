        execErrState: Error
        for: 3m
        annotations:
          description: 'Phase 8 dual storage error rate is {{ $values.B.dual_storage_error_rate | humanizePercentage }} (threshold: 1%). CSV writes are primary and unaffected, but columnar validation is compromised. Check columnar storage logs.'
          summary: 'High: Phase 8 validation at risk'
        labels:
          severity: high
          component: phase8_storage
          impact: medium
        isPaused: false

